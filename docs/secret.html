<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OASIS Core Initialization</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .retro-terminal {
            width: 90%;
            max-width: 700px;
            padding: 30px;
            border: 1px solid #33ff33;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.2);
            border-radius: 8px;
            position: relative;
        }
        .line {
            font-size: 1.3rem;
            line-height: 1.8;
            white-space: pre-wrap;
            border-right: 2px solid #33ff33;
            animation: blink 0.75s step-end infinite;
            text-shadow: 0 0 5px #33ff33;
        }
        .back-link {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: rgba(51, 255, 51, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            color: #33ff33;
            text-shadow: 0 0 3px #33ff33;
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #33ff33; }
        }
    </style>
</head>
<body>

<div class="retro-terminal">
    <div id="typewriter" class="line"></div>
    <a href="index.html" class="back-link">< Повернутися до системи</a>
</div>

<script>
    // Легендарне відсилання у вашому форматі
    const textToType = "Перший учень приготувався...\n\nЗавантаження віртуального середовища OASIS...\nПошук тригерів пасхального яйця...\n\n[СИСТЕМА ГОТОВА ДО КВАНТОВОГО МОДЕЛЮВАННЯ]";
    let index = 0;
    const speed = 60; // Швидкість друку тексту в мс

    function typeWriter() {
        if (index < textToType.length) {
            document.getElementById("typewriter").textContent += textToType.charAt(index);
            index++;
            setTimeout(typeWriter, speed);
        }
    }

    // Запуск ефекту друкарської машинки після завантаження
    window.onload = typeWriter;
</script>
</body>
</html>
