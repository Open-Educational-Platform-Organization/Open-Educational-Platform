<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Educational Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #ecf2f8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 Open Educational Platform</h1>
    <p>Гейміфікований простір для навчання: IT, медицина, економіка та 3D/VR</p>
    <div class="badge">Стадія: Проєктування архітектури</div>
</div>

</body>
</html>
