<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Educational Platform</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            pointer-events: none;
        }
        .card {
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #30363d; /* ВИПРАВЛЕНО: solid замість border */
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #58a6ff;
            margin: 0 0 15px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #8b949e;
            margin: 0 0 25px 0;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(33, 38, 45, 0.6);
            border: 1px solid #30363d;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-weight: 500;
            margin-bottom: 25px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #3f6;
            border-radius: 50%;
            box-shadow: 0 0 8px #3f6;
            animation: pulse 2s infinite;
        }

        /* КНОПКА-ВЕЛИКОДКА */
        .btn-try {
            display: inline-block;
            text-decoration: none;
            padding: 12px 30px;
            background: transparent;
            color: #8b949e;
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }
        .btn-try:hover {
            color: #58a6ff;
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.05);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
            text-shadow: 0 0 5px rgba(88, 166, 255, 0.5);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(51, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(51, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(51, 255, 102, 0); }
        }
    </style>
</head>
<body>

<canvas id="simulationCanvas"></canvas>

<div class="ui-layer">
    <div class="card">
        <h1>🌍 Open Educational Platform</h1>
        <p>Відкрите інтерактивне середовище міждисциплінарного навчання: симуляції глибокої медицини, економічне моделювання, квантові обчислення та просторові 3D/VR інтерфейси.</p>
        <div>
            <div class="status-badge">
                <span class="status-dot"></span>
                Проєкт у розробці (Побудова ядра)
            </div>
        </div>
        <!-- Секретне посилання -->
        <a href="secret.html" class="btn-try">Спробувати увійти_</a>
    </div>
</div>

<script>
    const canvas = document.getElementById('simulationCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initMatrix();
    });

    // --- 1. Конфігурація Ефекту Матриці ---
    const matrixChars = "01ЗШ🔬⚛️💻📊🧬";
    const fontSize = 14;
    let columns = Math.floor(width / fontSize);
    let drops = [];

    function initMatrix() {
        columns = Math.floor(width / fontSize);
        drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }
    }
    initMatrix();

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 255, 68, 0.12)';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            if (Math.random() > 0.98) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);
            }

            drops[i] += 0.5;
            if (drops[i] * fontSize > height) {
                drops[i] = 0;
            }
        }
    }

    // --- 2. Конфігурація Квантових Зв'язків ---
    const quantumNodes = [];
    const maxNodes = 60;
    const connectionDist = 120;

    for (let i = 0; i < maxNodes; i++) {
        quantumNodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            radius: Math.random() * 2 + 1
        });
    }

    function drawQuantumNetwork() {
        ctx.fillStyle = 'rgba(88, 166, 255, 0.7)';

        quantumNodes.forEach(node => {
            node.x += node.vx;
            node.y += node.vy;

            if (node.x < 0 || node.x > width) node.vx *= -1;
            if (node.y < 0 || node.y > height) node.vy *= -1;

            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        for (let i = 0; i < quantumNodes.length; i++) {
            for (let j = i + 1; j < quantumNodes.length; j++) {
                const dx = quantumNodes[i].x - quantumNodes[j].x;
                const dy = quantumNodes[i].y - quantumNodes[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < connectionDist) {
                    const alpha = (1 - dist / connectionDist) * 0.18;
                    ctx.strokeStyle = `rgba(88, 166, 255, ${alpha})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(quantumNodes[i].x, quantumNodes[i].y);
                    ctx.lineTo(quantumNodes[j].x, quantumNodes[j].y);
                    ctx.stroke();
                }
            }
        }
    }

    // --- 3. Симуляція Молекул Глюкози ---
    const glucoseMolecules = [];
    const maxGlucose = 8;

    for (let i = 0; i < maxGlucose; i++) {
        glucoseMolecules.push({
            x: Math.random() * width,
            y: Math.random() * height,
            scale: Math.random() * 20 + 25,
            speed: Math.random() * 0.15 + 0.05,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.002
        });
    }

    function drawHexagon(x, y, size, angle) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = angle + (i * Math.PI / 3);
            const hx = x + size * Math.cos(a);
            const hy = y + size * Math.sin(a);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 122, 122, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 80, 80, 0.4)';
        for (let i = 0; i < 6; i += 2) {
            const a = angle + (i * Math.PI / 3);
            const ox = x + (size * 1.3) * Math.cos(a);
            const oy = y + (size * 1.3) * Math.sin(a);
            ctx.beginPath();
            ctx.arc(ox, oy, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawGlucoseField() {
        glucoseMolecules.forEach(mol => {
            mol.y -= mol.speed;
            mol.angle += mol.rotSpeed;

            if (mol.y < -mol.scale * 2) {
                mol.y = height + mol.scale * 2;
                mol.x = Math.random() * width;
            }

            drawHexagon(mol.x, mol.y, mol.scale, mol.angle);
        });
    }

    function render() {
        ctx.fillStyle = 'rgba(5, 7, 10, 0.08)';
        ctx.fillRect(0, 0, width, height);

        drawMatrix();
        drawQuantumNetwork();
        drawGlucoseField();

        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
